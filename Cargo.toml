[package]
name = "devtray"
version = "2.0.0"
edition = "2021"
authors = ["DevTray Contributors"]
description = "A system tray application to manage background development services"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
nix = { version = "0.29", features = ["process", "signal"] }
libc = "0.2"
crossbeam-channel = "0.5"
uuid = { version = "1.10", features = ["v4"] }
thiserror = "1.0"
cxx = "1.0"
cxx-qt = "0.9"
cxx-qt-lib = { version = "0.9", features = ["qt_full", "link_qt_object_files"] }
cxx-qt-lib-extras = { version = "0.9", features = ["link_qt_object_files"] }

[build-dependencies]
cxx-qt-build = { version = "0.9", features = ["link_qt_object_files"] }

[dev-dependencies]
tempfile = "3.12"
cxx-qt-lib-extras = { version = "0.9", features = ["link_qt_object_files"] }
