name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to release (e.g. v2.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install build dependencies & Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libx11-dev \
            libx11-xcb-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libdbus-1-dev \
            xvfb

      - name: Run Tests
        run: xvfb-run --auto-servernum cargo test --verbose

      - name: Build Release Binary
        run: cargo build --release

      - name: Package Release Assets
        run: |
          set -e
          TAG="${{ github.event.inputs.tag_name }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="v2.0.0"
          fi
          echo "TAG=$TAG" >> $GITHUB_ENV

          # Standalone release binary
          cp target/release/devtray "devtray-${TAG}-x86_64-unknown-linux-gnu"

          # Tarball package with desktop entry and icon
          mkdir -p "devtray-${TAG}"
          cp target/release/devtray "devtray-${TAG}/devtray"
          cp README.md "devtray-${TAG}/"
          mkdir -p "devtray-${TAG}/assets"
          cp assets/devtray.desktop "devtray-${TAG}/assets/"
          cp assets/icon.png "devtray-${TAG}/assets/"
          tar -czf "devtray-${TAG}-linux-x86_64.tar.gz" "devtray-${TAG}"

          ls -la "devtray-${TAG}-x86_64-unknown-linux-gnu" "devtray-${TAG}-linux-x86_64.tar.gz"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            devtray-*-x86_64-unknown-linux-gnu
            devtray-*-linux-x86_64.tar.gz
          generate_release_notes: true
