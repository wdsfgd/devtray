name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Qt6 and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            qt6-base-dev \
            qt6-base-private-dev \
            qt6-declarative-dev \
            qt6-tools-dev \
            qml6-module-qtquick \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts \
            qml6-module-qtquick-templates \
            qml6-module-qtquick-window \
            qml6-module-qt-labs-platform \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libx11-xcb-dev \
            libxrender-dev \
            libxi-dev \
            file \
            patchelf \
            libfuse2

      - name: Run Tests
        run: cargo test --verbose

      - name: Build Release Binary
        run: cargo build --release

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          QML_SOURCES_PATHS: ${{ github.workspace }}/qml
        run: |
          set -e
          TAG_NAME="${GITHUB_REF#refs/tags/}"

          # Create AppDir structure
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          cp target/release/devtray AppDir/usr/bin/devtray
          cp assets/devtray.desktop AppDir/usr/share/applications/devtray.desktop
          cp assets/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/devtray.png
          cp assets/icon.png AppDir/devtray.png

          # Download linuxdeploy and qt plugin
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage

          # Run linuxdeploy
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/devtray.desktop \
            --icon-file assets/icon.png \
            --plugin qt \
            --output appimage

          # Standardize release filenames
          mv DevTray-*.AppImage "DevTray-${TAG_NAME}-x86_64.AppImage"
          cp target/release/devtray "devtray-${TAG_NAME}-x86_64-unknown-linux-gnu"

          # Verify files exist
          ls -la DevTray-*.AppImage "devtray-${TAG_NAME}-x86_64-unknown-linux-gnu"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            DevTray-*-x86_64.AppImage
            devtray-*-x86_64-unknown-linux-gnu
          generate_release_notes: true
